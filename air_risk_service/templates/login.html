<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 서울시 AI 미세먼지 보건 분석 시스템</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* 로그인 페이지 전용 추가 스타일 */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px); /* 헤더/푸터 제외 중앙 배치 */
            padding: 100px 0;
        }

        .login-card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            width: 400px;
            box-sizing: border-box;
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 35px;
            letter-spacing: -1px;
        }

        .form-group { margin-bottom: 15px; }
        .form-label { font-size: 0.75rem; color: #888; font-weight: bold; margin-bottom: 8px; display: block; }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            border-color: #333;
            background: #fafafa;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .login-btn:active { transform: scale(0.98); }

        /* 로그인 하단 메뉴 (회원가입, 찾기) */
        .login-footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #777;
        }

        .login-footer-links a {
            text-decoration: none;
            color: #777;
            transition: color 0.2s;
        }

        .login-footer-links a:hover { color: #333; font-weight: bold; }

        .divider { color: #eee; }
    </style>
</head>
<body>

{% include 'header.html' %}

    <div class="container">
        <div class="login-card">
            <div class="login-title">로그인</div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <span class="form-label">아이디</span>
                    <input type="text" id="loginId" class="form-input" placeholder="아이디를 입력하세요" required>
                </div>

                <div class="form-group">
                    <span class="form-label">비밀번호</span>
                    <input type="password" id="loginPw" class="form-input" placeholder="비밀번호를 입력하세요" required>
                </div>

                <button type="submit" class="login-btn">로그인하기</button>
            </form>

            <div class="login-footer-links">
                <a href="{{ url_for('auth.signup') }}">회원가입</a>
                <span class="divider">|</span>
                <a href="{{ url_for('auth.find_account') }}">아이디 찾기</a>
                <span class="divider">|</span>
                <a href="{{ url_for('auth.find_account', type='pw') }}">비밀번호 찾기</a>
            </div>
        </div>
    </div>

{% include 'footer.html' %}

<button id="btn-back-to-top" title="맨 위로 가기">↑</button>

<script>
    async function handleLogin(event) {
        event.preventDefault(); // 폼 제출 시 페이지 새로고침 방지

        const id = document.getElementById('loginId').value;
        const pw = document.getElementById('loginPw').value;

        try {
            // 서버의 /login_process 라우트로 데이터를 보냅니다.
            const response = await fetch("{{ url_for('auth.login_process') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: id,
                    password: pw
                })
            });

            const data = await response.json();

            if (data.success) {
                alert(data.user_name + "님, 환영합니다!");
                location.href = "{{ url_for('main.index') }}";
            }else {
                // DB에 정보가 없거나 비밀번호가 틀린 경우
                alert(data.message || "아이디 또는 비밀번호가 일치하지 않습니다.");
            }
        } catch (error) {
            console.error("로그인 중 오류 발생:", error);
            alert("서버와 통신 중 오류가 발생했습니다.");
        }
    }

    document.getElementById('btn-back-to-top').addEventListener('click', function() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    });
</script>

</body>
</html>
